<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#04000C; overflow:hidden; }
  #wrap { position:relative; width:100%; max-width:760px; margin:0 auto; }

    touch-action:none; user-select:none; -webkit-user-select:none; outline:none; border-radius:6px; }

    border:3px solid #F050F8; outline:3px solid #2A0B5C; text-align:center; text-transform:uppercase;
    font-family:"Press Start 2P", ui-monospace, monospace; caret-color:#00F0FF; padding:0; border-radius:0; }
  #nameInput:focus { border-color:#00F0FF; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Zero Hunt arcade game. Arrow keys to steer, up to boost, down to brake."></canvas>
<input id="nameInput" maxlength="16" autocomplete="off" spellcheck="false" aria-label="Your name for the global scoreboard"></div>
<script>
(() => {
"use strict";
// =================================================================== constants
const W = 680, H = 660;
const PF_W = 450;                 // playfield width on screen
const SLED_Y = 392;               // the sled sits a bit above centre
let LINE_X = 225;                 // world x of sigma = 1/2 (set from the map)

const CATCH_R = 33, GREAT_R = 15, PERFECT_R = 6;
const N_ZEROS = 30;
const NAME_Y = 318;               // where the name box sits on the end screen
const PX = 3;                     // art pixel size
const COL = {
  void:"#04000C", deep:"#07001A", panel:"#0B0222", line:"#2A0B5C", pink:"#F050F8", pinkD:"#9A1AA4",
  cyan:"#00F0FF", cyanD:"#00808A", white:"#FFFFFF", grey:"#8A7AAE", dim:"#4A3A6E", gold:"#FFD166",
  red:"#FF3B6B", green:"#5CFFA0", yellow:"#FFE14D",

const FONT = '"Press Start 2P", ui-monospace, Menlo, monospace';

// =================================================================== canvas
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
let scale = 1, dpr = 1;
function resize() {

  canvas.width = Math.round(W * scale * dpr); canvas.height = Math.round(H * scale * dpr);
  canvas.style.height = (H * scale) + "px";
  const ni = document.getElementById("nameInput");
  ni.style.left = (75 / W * 100) + "%"; ni.style.width = (300 / W * 100) + "%";
  ni.style.top = (NAME_Y / H * 100) + "%"; ni.style.height = (42 * scale) + "px"; ni.style.fontSize = Math.round(14 * scale) + "px";
  sendHeight();
}
window.addEventListener("resize", resize);

// =================================================================== Streamlit protocol

let meta = null, board = [], nameDefault = "", runId = "", myRank = null, endStage = "", savingSince = 0;
window.addEventListener("message", (e) => {
  const d = e.data; if (!d || d.type !== "streamlit:render") return;
  const a = d.args || {};
  if (!meta && a.meta) { meta = a.meta; initWorld(); }
  if (Array.isArray(a.leaderboard)) board = a.leaderboard;
  if (a.player_name && !nameDefault) nameDefault = String(a.player_name);
  if (a.last && a.last.run_id && a.last.run_id === runId) {
    myRank = a.last.rank || null;
    if (endStage === "saving") { endStage = "board"; buildScorecard(); }
  }
  sendHeight();
});

// =================================================================== assets
const terrainImg = new Image(); let terrainReady = false;
terrainImg.onload = () => { terrainReady = true; };
terrainImg.src = "terrain.png";
let HMAP = null, HW = 0, HH = 0;
const heightImg = new Image();
heightImg.onload = () => {
  const c = document.createElement("canvas"); c.width = heightImg.width; c.height = heightImg.height;
  const g = c.getContext("2d"); g.drawImage(heightImg, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  HW = c.width; HH = c.height; HMAP = new Float32Array(HW * HH);
  for (let i = 0; i < HW * HH; i++) HMAP[i] = d[i * 4] / 255;
};
heightImg.src = "height.png";
let fontReady = false;
if (document.fonts && document.fonts.load) document.fonts.load('16px "Press Start 2P"').then(() => { fontReady = true; }).catch(() => {});

// =================================================================== sprites (8-bit)
const PAL = { P:"#F050F8", D:"#A41FAE", L:"#FFA6FF", W:"#FFFFFF", K:"#0B0020", R:"#E8264A", r:"#8E0F2C",
              Y:"#FFD166", y:"#B0801A", B:"#7A4A1E", b:"#4A2A10", G:"#1FA86A", g:"#0E5A3A", S:"#BFEFFF" };
const CONNIE = [
  "..........WW....",
  ".........RWW....",
  "........RRr.....",
  ".......RRRr.....",
  "......RRRRRr....",
  ".....RRRRRRr....",
  "....WWWWWWWWW...",
  "...WWWWWWWWWWW..",
  "...LLPPPPPPPPP..",
  "..LPPPPPPPPPPPD.",
  "..PPWWPPPPWWPPD.",
  "..PPWKPPPPWKPPD.",
  "..PPWKPPPPWKPPD.",
  "..PLLPPPPPPLLPD.",
  "..PPPPKPPKPPPPD.",
  "...PPPPKKPPPPD..",
  "...DPDPDPDPDPD..",
];
const LEGS_A = ["..PD.PD.PD.PD.P.", ".P..P..P..P...P."];
const LEGS_B = ["..DP.DP.DP.DP...", "...P..P..P..P..."];
const SAD_MOUTH = ["..PPPPPKKPPPPPD.", "...PPPKPPKPPPD.."];
const SLED = [
  "Y......................Y",
  "Y.BBBBBBBBBBBBBBBBBBBB.Y",
  "Y.BbbbbbbbbbbbbbbbbbbB.Y",
  "Y.BBBBBBBBBBBBBBBBBBBB.Y",
  "Yy....................yY",
  ".YY..................YY.",
];
const BAUBLE = ["...Y...", "..YyY..", ".CCCCC.", "CWCCCCC", "CWCCCCc", "CCCCCCc", ".cCCCc.", "..ccc.."];
const BAUBLE_COLS = [["#F050F8", "#9A1AA4"], ["#00F0FF", "#00808A"], ["#FFFFFF", "#9A9AC0"], ["#FFD166", "#9A6B00"]];

function makeSprite(rows, pal, px = PX) {
  const c = document.createElement("canvas"); c.width = rows[0].length * px; c.height = rows.length * px;
  const g = c.getContext("2d");
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== "." && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x * px, y * px, px, px); } }));
  return c;
}
const sprConnie = [makeSprite([...CONNIE, ...LEGS_A], PAL), makeSprite([...CONNIE, ...LEGS_B], PAL)];
const sprConnieSad = makeSprite([...CONNIE.slice(0, 14), ...SAD_MOUTH, "...DPDPDPDPDPD..", ...LEGS_A], PAL);
const sprConnieBig = [makeSprite([...CONNIE, ...LEGS_A], PAL, 7), makeSprite([...CONNIE, ...LEGS_B], PAL, 7)];
const sprSled = makeSprite(SLED, PAL), sprSledBig = makeSprite(SLED, PAL, 7);
const sprBaubles = BAUBLE_COLS.map(([c, d]) => makeSprite(BAUBLE, Object.assign({}, PAL, { C:c, c:d })));
const sprBaubleDead = makeSprite(BAUBLE, Object.assign({}, PAL, { C:"#3A2A5A", c:"#24173D", W:"#5A4A7A", Y:"#5A4A7A", y:"#3A2A5A" }));
const sprBaublesSmall = BAUBLE_COLS.map(([c, d]) => makeSprite(BAUBLE, Object.assign({}, PAL, { C:c, c:d }), 2));
const sprBaubleSmallDead = makeSprite(BAUBLE, Object.assign({}, PAL, { C:"#2A1A48", c:"#1A0F30", W:"#3A2A5A", Y:"#3A2A5A", y:"#2A1A48" }), 2);

// CRT overlay (scanlines + vignette), built once at 1x logical size
const crt = document.createElement("canvas"); crt.width = W; crt.height = H;
(() => { const g = crt.getContext("2d");
  g.fillStyle = "rgba(0,0,0,0.16)"; for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.82);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.55)"); g.fillStyle = v; g.fillRect(0, 0, W, H); })();

// =================================================================== audio: e-piano chimes + swing chip bass
let actx = null, master = null, muted = false;
function audio() {

  if (actx.state === "suspended") actx.resume();

}
function setMuted(m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 1, actx.currentTime, 0.02); }
function osc(type, f, t0, dur, vol, opts = {}) {

  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

function noiseHit(t0, dur, vol, hp = 7000) {
  const a = actx; if (!a) return;
  const len = Math.max(1, Math.floor(a.sampleRate * dur)), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const s = a.createBufferSource(); s.buffer = buf; const f = a.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
  const g = a.createGain(); g.gain.value = vol; s.connect(f).connect(g).connect(master); s.start(t0);

const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
function epiano(midi, t0, vol = 0.09, dur = 0.9) {
  const f = hz(midi);
  osc("sine", f, t0, dur, vol); osc("triangle", f, t0, dur * 0.7, vol * 0.35, { detune: 6 });

// =================================================================== jazz: three tracks, one swing clock
function bassNote(m, t, d, v = 0.11) { osc("triangle", hz(m), t, d, v, { attack: 0.005 }); }
function ride(t, v) { noiseHit(t, 0.07, v, 7500); }
function hat(t, v) { noiseHit(t, 0.03, v, 9500); }
function snare(t, v) { noiseHit(t, 0.13, v, 1600); }
function rim(t) { osc("square", 1650, t, 0.025, 0.02, { lp: 4000 }); }
function compEP(v, t, vol) { v.forEach((m, i) => epiano(m, t + i * 0.008, vol, 0.55)); }
function compSq(v, t, vol, d = 0.09) { v.forEach(m => osc("square", hz(m), t, d, vol, { lp: 1500 })); }
const TRACKS = [
  { id: "swing", name: "SWING", bpm: 132, swing: 0.667,
    melody: [62, 65, 67, 69, 72, 74, 76, 77, 79, 81, 84, 86],                 // D dorian
    chords: [
      { n: "Dm11",      bass: [38, 41, 45, 44], v: [53, 57, 60, 64, 67] },
      { n: "G13b9",     bass: [43, 47, 50, 49], v: [53, 59, 64, 68] },
      { n: "Cmaj9#11",  bass: [36, 40, 43, 46], v: [52, 59, 62, 66] },
      { n: "A7alt",     bass: [45, 49, 52, 51], v: [55, 61, 65, 72] },
    ],
    beat(ch, b, t, spb) {
      bassNote(ch.bass[b], t, spb * 0.9);
      ride(t, 0.02); if (b === 1 || b === 3) { ride(t + spb * this.swing, 0.016); hat(t, 0.03); }
      if (b === 1) compEP(ch.v, t + spb * this.swing, 0.014);
      if (b === 3 && (t * 7 | 0) % 3 === 0) compEP(ch.v, t + spb * this.swing, 0.011);
    } },
  { id: "blues", name: "BLUES", bpm: 112, swing: 0.667,
    melody: [65, 68, 70, 71, 72, 75, 77, 80, 82, 84, 87, 89],                 // F blues scale
    chords: [   // 12-bar in F with extensions
      { n: "F13",    bass: [41, 45, 48, 50], v: [57, 63, 67, 74] },
      { n: "Bb13",   bass: [46, 50, 53, 55], v: [56, 62, 67, 72] },
      { n: "F13",    bass: [41, 45, 48, 50], v: [57, 63, 67, 74] },
      { n: "F7#9",   bass: [41, 45, 48, 51], v: [57, 63, 68] },
      { n: "Bb9",    bass: [46, 50, 53, 55], v: [56, 60, 62, 65] },
      { n: "Bdim7",  bass: [47, 50, 53, 56], v: [59, 62, 65, 68] },
      { n: "F13",    bass: [41, 45, 48, 50], v: [57, 63, 67, 74] },
      { n: "D7#9",   bass: [38, 42, 45, 47], v: [54, 60, 65] },
      { n: "Gm11",   bass: [43, 46, 50, 52], v: [58, 60, 65, 69] },
      { n: "C13b9",  bass: [36, 40, 43, 45], v: [58, 61, 64, 69] },
      { n: "F13",    bass: [41, 45, 48, 50], v: [57, 63, 67, 74] },
      { n: "C7#9",   bass: [36, 40, 43, 46], v: [52, 58, 63] },
    ],
    beat(ch, b, t, spb) {
      bassNote(ch.bass[b], t, spb * 0.55, 0.12);                        // boogie walk, shuffled
      bassNote(ch.bass[b] + 12, t + spb * this.swing, spb * 0.25, 0.04);
      hat(t, 0.025); hat(t + spb * this.swing, 0.02);
      if (b === 1 || b === 3) { snare(t, 0.035); compSq(ch.v, t, 0.009, 0.12); }
      if (b === 3) compSq(ch.v, t + spb * this.swing, 0.008, 0.08);    // push into the next bar
    } },
  { id: "modal", name: "MODAL", bpm: 108, swing: 0.6,
    melody: [64, 66, 67, 69, 71, 73, 74, 76, 78, 81, 83, 86],                 // E dorian
    chords: [   // quartal vamp
      { n: "Em11",      bass: [40, 47, 50, 47], v: [52, 57, 62, 67, 71] },
      { n: "Em11",      bass: [40, 47, 52, 50], v: [52, 57, 62, 67, 71] },
      { n: "Fmaj7#11",  bass: [41, 48, 52, 48], v: [53, 57, 59, 64, 69] },
      { n: "Em11",      bass: [40, 47, 50, 45], v: [52, 57, 62, 67, 71] },
      { n: "Em11",      bass: [40, 43, 47, 50], v: [52, 57, 62, 67, 71] },
      { n: "D/E",       bass: [40, 45, 50, 45], v: [54, 57, 62, 66, 69] },
      { n: "Cmaj7#11/E",bass: [40, 47, 52, 47], v: [52, 55, 59, 66] },
      { n: "Fmaj7#11",  bass: [41, 45, 48, 52], v: [53, 57, 59, 64, 69] },
    ],
    beat(ch, b, t, spb) {
      bassNote(ch.bass[b], t, spb * 0.95, 0.1);
      noiseHit(t, 0.16, 0.012, 3200);                                    // brushes
      noiseHit(t + spb * this.swing, 0.08, 0.008, 3200);
      if (b === 3) rim(t);

      if (b === 1 && (Math.round(t / spb) % 8) < 4) compEP(ch.v, t + spb * this.swing, 0.012);
    } },
];
let trackIdx = 0;
try { trackIdx = Math.max(0, TRACKS.findIndex(tr => tr.id === localStorage.getItem("zerohunt_track"))); } catch (_) {}
const track = () => TRACKS[trackIdx];
function pingPong(i) { const M = track().melody, n = M.length, p = 2 * (n - 1), k = ((i % p) + p) % p; return M[k < n ? k : p - k]; }
let catchNote = 0;
const sfx = {
  // the chime lands on the bauble's arrival (a swung off-beat when the band is playing)

    if (!audio()) return; const t = Math.max(actx.currentTime, at || actx.currentTime);

    if (rating >= 2) epiano(note + 7, t + track().swing * 60 / track().bpm / 2, 0.05, 0.6);   // perfect: grace fifth
    const ch = chordAt(t);
    ch.v.forEach((m, i) => epiano(m, t + 0.01 + i * 0.012, 0.02, 0.7));
    if (combo > 0 && combo % 5 === 0) ch.v.concat(ch.v.map(m => m + 12)).forEach((m, i) => epiano(m + 12, t + 0.1 + i * 0.045, 0.03, 0.5));

  catchTick() { if (!audio()) return; const t = actx.currentTime; noiseHit(t, 0.03, 0.05, 6000); osc("triangle", 2093, t, 0.05, 0.03); },
  skid() { if (!audio()) return; noiseHit(actx.currentTime, 0.12, 0.025, 2500); },
  miss() { if (!audio()) return; const t = actx.currentTime; osc("square", hz(64), t, 0.12, 0.035, { lp: 1800 }); osc("square", hz(61), t + 0.1, 0.22, 0.035, { lp: 1400, slide: hz(55) }); catchNote = 0; },
  beep(hi) { if (!audio()) return; osc("square", hi ? 880 : 440, actx.currentTime, hi ? 0.35 : 0.12, 0.05, { lp: 3000 }); },
  boost() { if (!audio()) return; noiseHit(actx.currentTime, 0.25, 0.04, 1500); },
  fall() { if (!audio()) return; const t = actx.currentTime; osc("sine", 1100, t, 0.8, 0.07, { slide: 90 }); osc("square", 550, t, 0.8, 0.015, { slide: 45, lp: 1200 }); },
  respawn() { if (!audio()) return; const t = actx.currentTime; [62, 66, 69, 74].forEach((m, i) => osc("square", hz(m), t + i * 0.06, 0.12, 0.03, { lp: 2500 })); },
  bump() { if (!audio()) return; osc("triangle", 110, actx.currentTime, 0.08, 0.05, { slide: 70 }); },

// scheduler: one clock (musicT0) so catches can be quantised to the band's off-beats
let musicOn = false, nextBeat = 0, beatIndex = 0, musicTimer = null, musicT0 = 0;

// =================================================================== world
let zeros = [], phase = "title";        // title | countdown | play | paused | end
let tNow = 2.5, vt = 0, sx = LINE_X, vx = 0, ang = 0, angV = 0;

const FALL_S = 0.85, RESPAWN_S = 0.75;

let pointerSteer = 0, focused = true, lastScorecard = "", copyMsgUntil = 0;
let usedBoost = false, usedSteer = false, skidCooldown = 0;
try { hiScore = +(localStorage.getItem("zerohunt_hi") || 0); } catch (_) {}

function initWorld() { LINE_X = xOfSigma(0.5); resetRun(); }

  usedBoost = false; usedSteer = false; endStage = ""; myRank = null; hideNameInput();
