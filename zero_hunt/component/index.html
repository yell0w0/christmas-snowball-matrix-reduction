<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#04000C; overflow:hidden; }
  #wrap { position:relative; width:100%; max-width:760px; margin:0 auto; }
  canvas { display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges;
    touch-action:none; user-select:none; -webkit-user-select:none; outline:none; border-radius:6px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Zero Hunt arcade game. Arrow keys to steer, up to boost, down to brake."></canvas></div>
<script>
(() => {
"use strict";
// =================================================================== constants
const W = 680, H = 660;
const PF_W = 450;                 // playfield width (terrain is 150 art px x3)
const SLED_Y = 392;               // the sled sits a bit above centre
const LINE_X = 225;               // sigma = 1/2
const CATCH_R = 33, GREAT_R = 15, PERFECT_R = 6;
const N_ZEROS = 30;
const PX = 3;                     // art pixel size
const COL = {
  void:"#04000C", deep:"#07001A", panel:"#0B0222", line:"#2A0B5C", pink:"#F050F8", pinkD:"#9A1AA4",
  cyan:"#00F0FF", cyanD:"#00808A", white:"#FFFFFF", grey:"#8A7AAE", dim:"#4A3A6E", gold:"#FFD166",
  red:"#FF3B6B", green:"#5CFFA0",
};
const FONT = '"Press Start 2P", ui-monospace, Menlo, monospace';

// =================================================================== canvas
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
let scale = 1, dpr = 1;
function resize() {
  const cssW = canvas.parentElement.clientWidth || W;
  scale = cssW / W; dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * scale * dpr); canvas.height = Math.round(H * scale * dpr);
  canvas.style.height = (H * scale) + "px";
  sendHeight();
}
window.addEventListener("resize", resize);

// =================================================================== Streamlit protocol
function post(type, data) { if (window.parent !== window) window.parent.postMessage(Object.assign({ isStreamlitMessage:true, type }, data), "*"); }
function sendHeight() { post("streamlit:setFrameHeight", { height: Math.ceil(H * scale) + 4 }); }
let meta = null;
window.addEventListener("message", (e) => {
  const d = e.data; if (!d || d.type !== "streamlit:render") return;
  if (!meta && d.args && d.args.meta) { meta = d.args.meta; initWorld(); }
  sendHeight();
});

// =================================================================== assets
const terrainImg = new Image(); let terrainReady = false;
terrainImg.onload = () => { terrainReady = true; };
terrainImg.src = "terrain.png";
let HMAP = null, HW = 0, HH = 0;
const heightImg = new Image();
heightImg.onload = () => {
  const c = document.createElement("canvas"); c.width = heightImg.width; c.height = heightImg.height;
  const g = c.getContext("2d"); g.drawImage(heightImg, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  HW = c.width; HH = c.height; HMAP = new Float32Array(HW * HH);
  for (let i = 0; i < HW * HH; i++) HMAP[i] = d[i * 4] / 255;
};
heightImg.src = "height.png";
let fontReady = false;
if (document.fonts && document.fonts.load) document.fonts.load('16px "Press Start 2P"').then(() => { fontReady = true; }).catch(() => {});

// =================================================================== sprites (8-bit)
const PAL = { P:"#F050F8", D:"#A41FAE", L:"#FFA6FF", W:"#FFFFFF", K:"#0B0020", R:"#E8264A", r:"#8E0F2C",
              Y:"#FFD166", y:"#B0801A", B:"#7A4A1E", b:"#4A2A10", G:"#1FA86A", g:"#0E5A3A", S:"#BFEFFF" };
const CONNIE = [
  "..........WW....",
  ".........RWW....",
  "........RRr.....",
  ".......RRRr.....",
  "......RRRRRr....",
  ".....RRRRRRr....",
  "....WWWWWWWWW...",
  "...WWWWWWWWWWW..",
  "...LLPPPPPPPPP..",
  "..LPPPPPPPPPPPD.",
  "..PPWWPPPPWWPPD.",
  "..PPWKPPPPWKPPD.",
  "..PPWKPPPPWKPPD.",
  "..PLLPPPPPPLLPD.",
  "..PPPPKPPKPPPPD.",
  "...PPPPKKPPPPD..",
  "...DPDPDPDPDPD..",
];
const LEGS_A = ["..PD.PD.PD.PD.P.", ".P..P..P..P...P."];
const LEGS_B = ["..DP.DP.DP.DP...", "...P..P..P..P..."];
const SAD_MOUTH = ["..PPPPPKKPPPPPD.", "...PPPKPPKPPPD.."];
const SLED = [
  "Y......................Y",
  "Y.BBBBBBBBBBBBBBBBBBBB.Y",
  "Y.BbbbbbbbbbbbbbbbbbbB.Y",
  "Y.BBBBBBBBBBBBBBBBBBBB.Y",
  "Yy....................yY",
  ".YY..................YY.",
];
const BAUBLE = ["...Y...", "..YyY..", ".CCCCC.", "CWCCCCC", "CWCCCCc", "CCCCCCc", ".cCCCc.", "..ccc.."];
const BAUBLE_COLS = [["#F050F8", "#9A1AA4"], ["#00F0FF", "#00808A"], ["#FFFFFF", "#9A9AC0"], ["#FFD166", "#9A6B00"]];

function makeSprite(rows, pal, px = PX) {
  const c = document.createElement("canvas"); c.width = rows[0].length * px; c.height = rows.length * px;
  const g = c.getContext("2d");
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== "." && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x * px, y * px, px, px); } }));
  return c;
}
const sprConnie = [makeSprite([...CONNIE, ...LEGS_A], PAL), makeSprite([...CONNIE, ...LEGS_B], PAL)];
const sprConnieSad = makeSprite([...CONNIE.slice(0, 14), ...SAD_MOUTH, "...DPDPDPDPDPD..", ...LEGS_A], PAL);
const sprConnieBig = [makeSprite([...CONNIE, ...LEGS_A], PAL, 7), makeSprite([...CONNIE, ...LEGS_B], PAL, 7)];
const sprSled = makeSprite(SLED, PAL), sprSledBig = makeSprite(SLED, PAL, 7);
const sprBaubles = BAUBLE_COLS.map(([c, d]) => makeSprite(BAUBLE, Object.assign({}, PAL, { C:c, c:d })));
const sprBaubleDead = makeSprite(BAUBLE, Object.assign({}, PAL, { C:"#3A2A5A", c:"#24173D", W:"#5A4A7A", Y:"#5A4A7A", y:"#3A2A5A" }));
const sprBaublesSmall = BAUBLE_COLS.map(([c, d]) => makeSprite(BAUBLE, Object.assign({}, PAL, { C:c, c:d }), 2));
const sprBaubleSmallDead = makeSprite(BAUBLE, Object.assign({}, PAL, { C:"#2A1A48", c:"#1A0F30", W:"#3A2A5A", Y:"#3A2A5A", y:"#2A1A48" }), 2);

// CRT overlay (scanlines + vignette), built once at 1x logical size
const crt = document.createElement("canvas"); crt.width = W; crt.height = H;
(() => { const g = crt.getContext("2d");
  g.fillStyle = "rgba(0,0,0,0.16)"; for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.82);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.55)"); g.fillStyle = v; g.fillRect(0, 0, W, H); })();

// =================================================================== audio: e-piano chimes + swing chip bass
let actx = null, master = null, muted = false;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = muted ? 0 : 1; master.connect(actx.destination); } catch (_) { return null; } }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function setMuted(m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 1, actx.currentTime, 0.02); }
function osc(type, f, t0, dur, vol, opts = {}) {
  const a = actx; if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
  if (opts.slide) o.frequency.exponentialRampToValueAtTime(opts.slide, t0 + dur);
  if (opts.detune) o.detune.value = opts.detune;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + (opts.attack || 0.008));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = o;
  if (opts.lp) { const f2 = a.createBiquadFilter(); f2.type = "lowpass"; f2.frequency.value = opts.lp; o.connect(f2); node = f2; }
  node.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noiseHit(t0, dur, vol, hp = 7000) {
  const a = actx; if (!a) return;
  const len = Math.max(1, Math.floor(a.sampleRate * dur)), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  const s = a.createBufferSource(); s.buffer = buf; const f = a.createBiquadFilter(); f.type = "highpass"; f.frequency.value = hp;
  const g = a.createGain(); g.gain.value = vol; s.connect(f).connect(g).connect(master); s.start(t0);
}
const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);
function epiano(midi, t0, vol = 0.09, dur = 0.9) {
  const f = hz(midi);
  osc("sine", f, t0, dur, vol); osc("triangle", f, t0, dur * 0.7, vol * 0.35, { detune: 6 });
  osc("sine", f * 2, t0, dur * 0.35, vol * 0.25); osc("sine", f * 4.01, t0, 0.12, vol * 0.18);
}
// D dorian with colour tones; catches walk up then back down (ping-pong)
const MELODY = [62, 65, 67, 69, 72, 74, 76, 77, 79, 81, 84, 86];
function pingPong(i) { const n = MELODY.length, p = 2 * (n - 1), k = ((i % p) + p) % p; return MELODY[k < n ? k : p - k]; }
// ii - V - I - VI7 in C, voiced as rootless-ish jazz chords
const CHORDS = [
  { name:"Dm9",  bass:[38, 41, 45, 44], voicing:[53, 57, 60, 64] },
  { name:"G13",  bass:[43, 47, 50, 49], voicing:[53, 59, 64, 69] },
  { name:"Cmaj9",bass:[36, 40, 43, 46], voicing:[52, 55, 59, 62] },
  { name:"A7b9", bass:[45, 49, 52, 51], voicing:[55, 58, 61, 67] },
];
let catchNote = 0;
const sfx = {
  catchChime(rating, combo) {
    if (!audio()) return; const t = actx.currentTime;
    const note = pingPong(catchNote++);
    epiano(note, t, 0.1);
    if (rating >= 2) epiano(note + 7, t + 0.07, 0.05, 0.6);            // perfect: add a fifth sparkle
    const ch = CHORDS[Math.floor(beatIndex / 4) % CHORDS.length];
    ch.voicing.forEach((m, i) => epiano(m, t + 0.01 + i * 0.012, 0.022, 0.7));
    if (combo > 0 && combo % 5 === 0) [0, 3, 7, 10, 14].forEach((d, i) => epiano(note + d, t + 0.12 + i * 0.05, 0.035, 0.5));
  },
  miss() { if (!audio()) return; const t = actx.currentTime; osc("square", hz(64), t, 0.12, 0.035, { lp: 1800 }); osc("square", hz(61), t + 0.1, 0.22, 0.035, { lp: 1400, slide: hz(55) }); catchNote = 0; },
  beep(hi) { if (!audio()) return; osc("square", hi ? 880 : 440, actx.currentTime, hi ? 0.35 : 0.12, 0.05, { lp: 3000 }); },
  boost() { if (!audio()) return; noiseHit(actx.currentTime, 0.25, 0.04, 1500); },
  bump() { if (!audio()) return; osc("triangle", 110, actx.currentTime, 0.08, 0.05, { slide: 70 }); },
  fanfare() {
    if (!audio()) return; const t = actx.currentTime;
    [[50, 53, 57, 60, 64], [43, 53, 59, 64, 69], [48, 52, 55, 59, 62, 67]].forEach((ch, k) =>
      ch.forEach((m, i) => epiano(m + 12, t + k * 0.45 + i * 0.03, 0.04, k === 2 ? 2.2 : 0.8)));
    [74, 76, 79, 83, 86].forEach((m, i) => epiano(m, t + 0.9 + i * 0.09, 0.06, 1.2));
  },
};
// swing scheduler
const BPM = 132; let musicOn = false, nextBeat = 0, beatIndex = 0, musicTimer = null;
function scheduleMusic() {
  if (!actx || !musicOn) return;
  const spb = 60 / BPM;
  while (nextBeat < actx.currentTime + 0.12) {
    const ch = CHORDS[Math.floor(beatIndex / 4) % CHORDS.length], b = beatIndex % 4;
    osc("triangle", hz(ch.bass[b]), nextBeat, spb * 0.9, 0.11, { attack: 0.005 });
    noiseHit(nextBeat + spb * 0.667, 0.04, 0.018);                     // swung "and"
    if (b === 1 || b === 3) noiseHit(nextBeat, 0.09, 0.03, 5000);       // 2 and 4
    if (b === 1) ch.voicing.forEach(m => osc("square", hz(m), nextBeat + spb * 0.667, 0.09, 0.008, { lp: 1600 }));
    nextBeat += spb; beatIndex++;
  }
}
function musicStart() { if (!audio()) return; musicOn = true; nextBeat = actx.currentTime + 0.05; beatIndex = 0; clearInterval(musicTimer); musicTimer = setInterval(scheduleMusic, 25); }
function musicStop() { musicOn = false; clearInterval(musicTimer); }

// =================================================================== world
let zeros = [], phase = "title";        // title | countdown | play | paused | end
let tNow = 2.5, vt = 0, sx = LINE_X, vx = 0, ang = 0, angV = 0;
let score = 0, combo = 0, bestCombo = 0, caught = 0, missed = 0, elapsed = 0, countdown = 0, timeBonus = 0;
let hiScore = 0, newHi = false, sadUntil = 0, flash = 0, flashCol = COL.white, shake = 0;
let particles = [], popups = [], flyers = [], trail = [], flakes = [];
const keys = { left:false, right:false, up:false, down:false };
let pointerSteer = 0, focused = true, lastScorecard = "", copyMsgUntil = 0;
try { hiScore = +(localStorage.getItem("zerohunt_hi") || 0); } catch (_) {}

function initWorld() { resetRun(); }
function resetRun() {
  zeros = meta.zeros.slice(0, N_ZEROS).map((t, i) => ({ t, state:"up", slot:i, rating:0 }));
  tNow = 2.5; vt = 0.6; sx = LINE_X; vx = 0; ang = 0; angV = 0;
  score = 0; combo = 0; bestCombo = 0; caught = 0; missed = 0; elapsed = 0; timeBonus = 0; newHi = false;
  particles = []; popups = []; flyers = []; trail = []; catchNote = 0;
}
function startGame() {
  if (!meta || !HMAP) return;
  audio(); resetRun(); phase = "countdown"; countdown = 3.0; sfx.beep(false);
  canvas.focus();
}
const toY = (t) => SLED_Y - (t - tNow) * meta.art_px_per_t * PX;
const sigmaOfX = (x) => meta.sigma_min + x / (meta.art_px_per_sigma * PX);

// bilinear height in [h_min, h_max]
function heightAt(sigma, t) {
  if (!HMAP) return 0;
  const ax = (sigma - meta.sigma_min) * meta.art_px_per_sigma - 0.5;
  const ay = (meta.t_max - t) * meta.art_px_per_t - 0.5;
  const x0 = Math.max(0, Math.min(HW - 2, Math.floor(ax))), y0 = Math.max(0, Math.min(HH - 2, Math.floor(ay)));
  const fx = Math.max(0, Math.min(1, ax - x0)), fy = Math.max(0, Math.min(1, ay - y0));
  const i = y0 * HW + x0;
  const v = HMAP[i] * (1 - fx) * (1 - fy) + HMAP[i + 1] * fx * (1 - fy) + HMAP[i + HW] * (1 - fx) * fy + HMAP[i + HW + 1] * fx * fy;
  return meta.h_min + v * (meta.h_max - meta.h_min);
}

// =================================================================== input
const KEYMAP = { ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down", KeyA:"left", KeyD:"right", KeyW:"up", KeyS:"down" };
window.addEventListener("keydown", (e) => {
  if (KEYMAP[e.code]) { e.preventDefault(); const k = KEYMAP[e.code]; if (k === "up" && !keys.up && phase === "play") sfx.boost(); keys[k] = true; }
  if (e.code === "Space" || e.code === "Enter") { e.preventDefault(); if (phase === "title" || phase === "end") startGame(); else if (phase === "paused") resume(); }
  if (e.code === "KeyP" || e.code === "Escape") { if (phase === "play") pause(); else if (phase === "paused") resume(); }
  if (e.code === "KeyM") setMuted(!muted);
  if (e.code === "KeyC" && phase === "end") copyScorecard();
});
window.addEventListener("keyup", (e) => { if (KEYMAP[e.code]) { e.preventDefault(); keys[KEYMAP[e.code]] = false; } });
window.addEventListener("blur", () => { focused = false; Object.keys(keys).forEach(k => keys[k] = false); if (phase === "play") pause(); });
window.addEventListener("focus", () => { focused = true; });
function pause() { phase = "paused"; musicStop(); }
function resume() { phase = "play"; musicStart(); canvas.focus(); }

let buttons = [];
function toLogical(e) { const r = canvas.getBoundingClientRect(); return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H }; }
canvas.addEventListener("pointerdown", (e) => {
  canvas.focus(); focused = true; audio();
  const p = toLogical(e);
  const b = buttons.find(b => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h);
  if (b) { e.preventDefault(); b.act(); return; }
  if (phase === "title") { startGame(); return; }
  if (phase === "paused") { resume(); return; }
  if (phase === "play" && p.x < PF_W) { e.preventDefault(); pointerSteer = p.x < sx ? -1 : 1; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} }
});
canvas.addEventListener("pointerup", () => { pointerSteer = 0; });
canvas.addEventListener("pointercancel", () => { pointerSteer = 0; });

// =================================================================== game logic
function cruise(t) { return 1.05 + 0.011 * t; }
function update(dt) {
  if (phase === "countdown") {
    const before = Math.ceil(countdown); countdown -= dt; const after = Math.ceil(countdown);
    if (after !== before) { if (after > 0) sfx.beep(false); else { sfx.beep(true); phase = "play"; musicStart(); } }
    return;
  }
  if (phase !== "play") return;
  elapsed += dt;
  const sig = sigmaOfX(sx);
  // slopes (height per sigma, per t)
  const ds = 0.03, dtt = 0.06;
  const gS = (heightAt(sig + ds, tNow) - heightAt(sig - ds, tNow)) / (2 * ds);
  const gT = (heightAt(sig, tNow + dtt) - heightAt(sig, tNow - dtt)) / (2 * dtt);
  // forward: cruise, boost/brake, and real hills slow you down / speed you up
  const mult = keys.up ? 1.75 : keys.down ? 0.5 : 1.0;
  const slope = 1 - Math.max(-0.35, Math.min(0.45, 0.07 * gT));
  const target = Math.max(0.3, cruise(tNow) * mult * slope);
  vt += (target - vt) * Math.min(1, 3 * dt);
  tNow += vt * dt;
  // lateral: steering vs gravity sliding you off the hills
  const steer = (keys.left ? -1 : 0) + (keys.right ? 1 : 0) + pointerSteer;
  const gravity = Math.max(-620, Math.min(620, -46 * gS));
  vx += (steer * 1150 + gravity) * dt;
  vx *= Math.exp(-2.4 * dt);
  sx += vx * dt;
  if (sx < 14) { sx = 14; vx = Math.abs(vx) * 0.5; sfx.bump(); shake = 4; }
  if (sx > PF_W - 14) { sx = PF_W - 14; vx = -Math.abs(vx) * 0.5; sfx.bump(); shake = 4; }
  // wobble: spring towards lean, kicked by bumps in the snow
  const lean = vx / 1500 + gravity / 5000;
  angV += ((lean - ang) * 60 - angV * 7) * dt;
  angV += (Math.random() - 0.5) * Math.min(8, Math.abs(gS) * 0.25 + vt * 1.2) * dt * 10;
  ang += angV * dt; ang = Math.max(-0.45, Math.min(0.45, ang));
  // trail
  if (!trail.length || Math.abs(trail[trail.length - 1].t - tNow) > 0.06) { trail.push({ x: sx, t: tNow }); if (trail.length > 90) trail.shift(); }
  // spray when steering hard or boosting
  if ((Math.abs(steer) && Math.random() < 0.6) || (keys.up && Math.random() < 0.5)) {
    particles.push({ x: sx + (Math.random() - 0.5) * 30, y: SLED_Y + 26, vx: -vx * 0.05 + (Math.random() - 0.5) * 40, vy: 40 + Math.random() * 60, life: 0, max: 0.5, c: Math.random() < 0.7 ? COL.white : "#BFEFFF", s: 3 });
  }
  // baubles reached?
  for (const z of zeros) {
    if (z.state !== "up" || z.t > tNow) continue;
    const d = Math.abs(sx - LINE_X);
    if (d <= CATCH_R) catchBauble(z, d); else missBauble(z);
  }
  if (tNow > zeros[zeros.length - 1].t + 1.5) finish();
}
function catchBauble(z, d) {
  z.state = "caught"; caught++; combo++; bestCombo = Math.max(bestCombo, combo);
  const rating = d <= PERFECT_R ? 2 : d <= GREAT_R ? 1 : 0;
  z.rating = rating;
  const close = 1 - d / CATCH_R;
  const mult = 1 + 0.25 * Math.min(combo - 1, 8);
  const pts = Math.round((100 + 200 * close * close + (keys.up ? 50 : 0)) * mult);
  score += pts;
  const y = toY(z.t);
  popups.push({ x: LINE_X, y: y - 30, text: ["GOOD", "GREAT", "PERFECT"][rating], sub: "+" + pts, c: [COL.cyan, COL.green, COL.gold][rating], life: 0 });
  burst(LINE_X, SLED_Y, [COL.cyan, COL.pink, COL.white, COL.gold], rating === 2 ? 36 : 20, rating === 2 ? 260 : 180);
  flash = rating === 2 ? 0.35 : 0.18; flashCol = rating === 2 ? COL.gold : COL.cyan;
  flyers.push({ z, x0: LINE_X, y0: SLED_Y - 10, t0: performance.now(), dur: 700 });
  sfx.catchChime(rating, combo);
}
function missBauble(z) {
  z.state = "missed"; missed++; combo = 0; sadUntil = performance.now() + 900; shake = 6;
  popups.push({ x: LINE_X, y: SLED_Y - 40, text: "MISS", sub: "", c: COL.red, life: 0 });
  sfx.miss();
}
function burst(x, y, cols, n, sp) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, v = sp * (0.3 + Math.random() * 0.7);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0, max: 0.6 + Math.random() * 0.5, c: cols[i % cols.length], s: Math.random() < 0.3 ? 6 : 3, g: 260 }); }
}
function rankFor(n) { return n >= 30 ? "CRITICAL LINE LEGEND" : n >= 26 ? "BAUBLE BARON" : n >= 18 ? "PEAK BAGGER" : n >= 8 ? "SNOWPLOUGH APPRENTICE" : "LOST IN THE STRIP"; }
