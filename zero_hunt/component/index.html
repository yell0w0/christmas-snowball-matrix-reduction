<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; background:#04000C; overflow:hidden; }
  #wrap { position:relative; width:100%; max-width:760px; margin:0 auto; }
  canvas { display:block; width:100%; height:auto; image-rendering:pixelated; image-rendering:crisp-edges;
    touch-action:none; user-select:none; -webkit-user-select:none; outline:none; border-radius:6px; }
  #nameInput { position:absolute; display:none; box-sizing:border-box; background:#04000C; color:#FFD166;
    border:3px solid #F050F8; outline:3px solid #2A0B5C; text-align:center; text-transform:uppercase;
    font-family:"Press Start 2P", ui-monospace, monospace; caret-color:#00F0FF; padding:0; border-radius:0; }
  #nameInput:focus { border-color:#00F0FF; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Zero Hunt arcade game. Arrow keys to steer, up to boost, down to brake."></canvas>
<input id="nameInput" maxlength="16" autocomplete="off" spellcheck="false" aria-label="Your name for the global scoreboard"></div>
<script>
(() => {
"use strict";
// =================================================================== constants
const W = 680, H = 660;
const PF_W = 450;                 // playfield width on screen
const SLED_Y = 392;               // the sled sits a bit above centre
let LINE_X = 225;                 // world x of sigma = 1/2 (set from the map)
const CAM_X = 225;                // Constantine is pinned here on screen; the world moves
const CATCH_R = 33, GREAT_R = 15, PERFECT_R = 6;
const N_ZEROS = 30;
const NAME_Y = 318;               // where the name box sits on the end screen
const PX = 3;                     // art pixel size
const COL = {
  void:"#04000C", deep:"#07001A", panel:"#0B0222", line:"#2A0B5C", pink:"#F050F8", pinkD:"#9A1AA4",
  cyan:"#00F0FF", cyanD:"#00808A", white:"#FFFFFF", grey:"#8A7AAE", dim:"#4A3A6E", gold:"#FFD166",
  red:"#FF3B6B", green:"#5CFFA0", yellow:"#FFE14D",
};
const FONT = '"Press Start 2P", ui-monospace, Menlo, monospace';

// =================================================================== canvas
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
let scale = 1, dpr = 1;
function resize() {
  const cssW = canvas.parentElement.clientWidth || W;
  scale = cssW / W; dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * scale * dpr); canvas.height = Math.round(H * scale * dpr);
  canvas.style.height = (H * scale) + "px";
  const ni = document.getElementById("nameInput");
  ni.style.left = (75 / W * 100) + "%"; ni.style.width = (300 / W * 100) + "%";
  ni.style.top = (NAME_Y / H * 100) + "%"; ni.style.height = (42 * scale) + "px"; ni.style.fontSize = Math.round(14 * scale) + "px";
  sendHeight();
}
window.addEventListener("resize", resize);

// =================================================================== Streamlit protocol
function post(type, data) { if (window.parent !== window) window.parent.postMessage(Object.assign({ isStreamlitMessage:true, type }, data), "*"); }
function sendHeight() { post("streamlit:setFrameHeight", { height: Math.ceil(H * scale) + 4 }); }
let meta = null, board = [], nameDefault = "", runId = "", myRank = null, endStage = "", savingSince = 0;
window.addEventListener("message", (e) => {
  const d = e.data; if (!d || d.type !== "streamlit:render") return;
  const a = d.args || {};
  if (!meta && a.meta) { meta = a.meta; initWorld(); }
  if (Array.isArray(a.leaderboard)) board = a.leaderboard;
  if (a.player_name && !nameDefault) nameDefault = String(a.player_name);
  if (a.last && a.last.run_id && a.last.run_id === runId) {
    myRank = a.last.rank || null;
    if (endStage === "saving") { endStage = "board"; buildScorecard(); }
  }
  sendHeight();
});

// =================================================================== assets
const terrainImg = new Image(); let terrainReady = false;
terrainImg.onload = () => { terrainReady = true; };
terrainImg.src = "terrain.png";
let HMAP = null, HW = 0, HH = 0;
const heightImg = new Image();
heightImg.onload = () => {
  const c = document.createElement("canvas"); c.width = heightImg.width; c.height = heightImg.height;
  const g = c.getContext("2d"); g.drawImage(heightImg, 0, 0);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  HW = c.width; HH = c.height; HMAP = new Float32Array(HW * HH);
  for (let i = 0; i < HW * HH; i++) HMAP[i] = d[i * 4] / 255;
};
heightImg.src = "height.png";
let fontReady = false;
if (document.fonts && document.fonts.load) document.fonts.load('16px "Press Start 2P"').then(() => { fontReady = true; }).catch(() => {});

// =================================================================== sprites (8-bit)
const PAL = { P:"#F050F8", D:"#A41FAE", L:"#FFA6FF", W:"#FFFFFF", K:"#0B0020", R:"#E8264A", r:"#8E0F2C",
              Y:"#FFD166", y:"#B0801A", B:"#7A4A1E", b:"#4A2A10", G:"#1FA86A", g:"#0E5A3A", S:"#BFEFFF" };
const CONNIE = [
  "..........WW....",
  ".........RWW....",
  "........RRr.....",
  ".......RRRr.....",
  "......RRRRRr....",
  ".....RRRRRRr....",
  "....WWWWWWWWW...",
  "...WWWWWWWWWWW..",
  "...LLPPPPPPPPP..",
  "..LPPPPPPPPPPPD.",
  "..PPWWPPPPWWPPD.",
  "..PPWKPPPPWKPPD.",
  "..PPWKPPPPWKPPD.",
  "..PLLPPPPPPLLPD.",
  "..PPPPKPPKPPPPD.",
  "...PPPPKKPPPPD..",
  "...DPDPDPDPDPD..",
];
const LEGS_A = ["..PD.PD.PD.PD.P.", ".P..P..P..P...P."];
const LEGS_B = ["..DP.DP.DP.DP...", "...P..P..P..P..."];
const SAD_MOUTH = ["..PPPPPKKPPPPPD.", "...PPPKPPKPPPD.."];
const SLED = [
  "Y......................Y",
  "Y.BBBBBBBBBBBBBBBBBBBB.Y",
  "Y.BbbbbbbbbbbbbbbbbbbB.Y",
  "Y.BBBBBBBBBBBBBBBBBBBB.Y",
  "Yy....................yY",
  ".YY..................YY.",
];
const BAUBLE = ["...Y...", "..YyY..", ".CCCCC.", "CWCCCCC", "CWCCCCc", "CCCCCCc", ".cCCCc.", "..ccc.."];
const BAUBLE_COLS = [["#F050F8", "#9A1AA4"], ["#00F0FF", "#00808A"], ["#FFFFFF", "#9A9AC0"], ["#FFD166", "#9A6B00"]];

function makeSprite(rows, pal, px = PX) {
  const c = document.createElement("canvas"); c.width = rows[0].length * px; c.height = rows.length * px;
  const g = c.getContext("2d");
  rows.forEach((row, y) => [...row].forEach((ch, x) => { if (ch !== "." && pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x * px, y * px, px, px); } }));
  return c;
}
const sprConnie = [makeSprite([...CONNIE, ...LEGS_A], PAL), makeSprite([...CONNIE, ...LEGS_B], PAL)];
const sprConnieSad = makeSprite([...CONNIE.slice(0, 14), ...SAD_MOUTH, "...DPDPDPDPDPD..", ...LEGS_A], PAL);
const sprConnieBig = [makeSprite([...CONNIE, ...LEGS_A], PAL, 7), makeSprite([...CONNIE, ...LEGS_B], PAL, 7)];
const sprSled = makeSprite(SLED, PAL), sprSledBig = makeSprite(SLED, PAL, 7);
const sprBaubles = BAUBLE_COLS.map(([c, d]) => makeSprite(BAUBLE, Object.assign({}, PAL, { C:c, c:d })));
const sprBaubleDead = makeSprite(BAUBLE, Object.assign({}, PAL, { C:"#3A2A5A", c:"#24173D", W:"#5A4A7A", Y:"#5A4A7A", y:"#3A2A5A" }));
const sprBaublesSmall = BAUBLE_COLS.map(([c, d]) => makeSprite(BAUBLE, Object.assign({}, PAL, { C:c, c:d }), 2));
const sprBaubleSmallDead = makeSprite(BAUBLE, Object.assign({}, PAL, { C:"#2A1A48", c:"#1A0F30", W:"#3A2A5A", Y:"#3A2A5A", y:"#2A1A48" }), 2);

// CRT overlay (scanlines + vignette), built once at 1x logical size
const crt = document.createElement("canvas"); crt.width = W; crt.height = H;
(() => { const g = crt.getContext("2d");
  g.fillStyle = "rgba(0,0,0,0.16)"; for (let y = 0; y < H; y += 3) g.fillRect(0, y, W, 1);
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 0.82);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.55)"); g.fillStyle = v; g.fillRect(0, 0, W, H); })();

// =================================================================== audio engine
// A small jazz trio in Web Audio: piano (hammer-shaped harmonics, two detuned strings,
// velocity-sensitive brightness), upright bass, ride + hi-hat, a little room reverb.
// Harmony follows Jazzology (Rawlins & Bahha): rootless type A/B voicings with
// A<->B switches on root motion by 4ths/5ths, Garland-style right-hand block chords,
// So What voicings planed diatonically for the modal tune, swing comping rhythms.
let actx = null, master = null, musicBus = null, verbIn = null, pianoWave = null, muted = false;
function buildGraph(ctx) {
  actx = ctx;
  master = ctx.createGain(); master.gain.value = muted ? 0 : 1;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 14; comp.ratio.value = 3; comp.attack.value = 0.006; comp.release.value = 0.25;
  master.connect(comp).connect(ctx.destination);
  musicBus = ctx.createGain(); musicBus.gain.value = 1; musicBus.connect(master);
  const conv = ctx.createConvolver(); conv.buffer = roomImpulse(ctx, 1.7);
  const verbLP = ctx.createBiquadFilter(); verbLP.type = "lowpass"; verbLP.frequency.value = 4200;
  verbIn = ctx.createGain(); verbIn.gain.value = 0.2;
  verbIn.connect(conv).connect(verbLP).connect(master);
  // piano string spectrum: ~1/k^1.5 roll-off with a hammer-position comb (struck near 1/7 of the string)
  const n = 28, re = new Float32Array(n), im = new Float32Array(n);
  for (let k = 1; k < n; k++) im[k] = Math.pow(k, -1.5) * (0.3 + 0.7 * Math.abs(Math.sin(Math.PI * k / 7.4)));
  pianoWave = ctx.createPeriodicWave(re, im);
}
function roomImpulse(ctx, sec) {
  const sr = ctx.sampleRate, len = Math.floor(sr * sec), b = ctx.createBuffer(2, len, sr);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4) * Math.min(1, i / (0.01 * sr)); }
  return b;
}
function audio() {
  if (!actx) { try { buildGraph(new (window.AudioContext || window.webkitAudioContext)()); } catch (_) { actx = null; return null; } }
  if (actx.state === "suspended" && !(actx instanceof OfflineAudioContext)) actx.resume();
  return actx;
}
function setMuted(m) { muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : 1, actx.currentTime, 0.02); }
const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);

// ---- game SFX (deliberately chippy; the band is acoustic)
function osc(type, f, t0, dur, vol, opts = {}) {
  const a = actx; if (!a) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0);
  if (opts.slide) o.frequency.exponentialRampToValueAtTime(opts.slide, t0 + dur);
  if (opts.detune) o.detune.value = opts.detune;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + (opts.attack || 0.008));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let node = o;
  if (opts.lp) { const f2 = a.createBiquadFilter(); f2.type = "lowpass"; f2.frequency.value = opts.lp; o.connect(f2); node = f2; }
  node.connect(g).connect(opts.dest || master); o.start(t0); o.stop(t0 + dur + 0.05);
}
const noiseCache = {};
function noiseBuf(dur) {
  const key = actx.sampleRate + ":" + dur.toFixed(3);
  if (noiseCache[key] && noiseCache[key].ctx === actx) return noiseCache[key].buf;
  const len = Math.max(1, Math.floor(actx.sampleRate * dur)), buf = actx.createBuffer(1, len, actx.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  noiseCache[key] = { ctx: actx, buf }; return buf;
}
function noiseBurst(t0, dur, vol, type = "highpass", freq = 7000, q = 0.7, dest = master) {
  const a = actx; if (!a) return;
  const s = a.createBufferSource(); s.buffer = noiseBuf(dur);
  const f = a.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = a.createGain(); g.gain.value = vol; s.connect(f).connect(g).connect(dest); s.start(t0);
}
function noiseHit(t0, dur, vol, hp = 7000) { noiseBurst(t0, dur, vol, "highpass", hp); }

// ---- the trio
function pianoNote(midi, t0, vel = 0.5, dur = 0.8) {
  const a = actx; if (!a || !pianoWave) return;
  dur = Math.max(0.16, dur);
  const f = hz(midi), low = Math.max(0, Math.min(1, (88 - midi) / 48));
  const peak = 0.016 + 0.064 * vel * vel;
  const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.3;
  lp.frequency.setValueAtTime(Math.min(13000, f * (2.5 + 9 * vel) + 500), t0);
  lp.frequency.exponentialRampToValueAtTime(Math.max(f * 1.6, 420), t0 + 0.3 + 0.9 * low);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(peak, t0 + 0.005);
  g.gain.setTargetAtTime(peak * 0.38, t0 + 0.006, 0.07 + 0.08 * low);      // prompt sound
  g.gain.setTargetAtTime(0.0001, t0 + 0.14, 0.5 + 1.6 * low);              // aftersound
  g.gain.setTargetAtTime(0.0001, t0 + dur, 0.08);                          // damper
  for (const det of [-1.8, 2.1]) {
    const o = a.createOscillator(); o.setPeriodicWave(pianoWave); o.frequency.value = f; o.detune.value = det + (Math.random() - 0.5) * 0.8;
    o.connect(lp); o.start(t0); o.stop(t0 + dur + 0.7);
  }
  lp.connect(g); g.connect(musicBus); g.connect(verbIn);
  noiseBurst(t0, 0.02, 0.006 * vel, "lowpass", 1800, 0.5, musicBus);      // felt on string
}
function pianoChord(notes, t0, vel, dur, roll = 0.006) {
  notes.slice().sort((a, b) => a - b).forEach((m, i) => pianoNote(m, t0 + i * roll + Math.random() * 0.003, Math.max(0.05, vel + (Math.random() - 0.5) * 0.08), dur));
}
function epiano(midi, t0, vol = 0.06, dur = 0.6) { pianoNote(midi, t0, Math.min(0.9, vol * 7), dur); }   // UI blips
function upright(midi, t0, dur, vel = 0.75) {
  const a = actx; if (!a) return;
  const f = hz(midi), peak = 0.13 * vel;
  const lp = a.createBiquadFilter(); lp.type = "lowpass"; lp.Q.value = 0.9;
  lp.frequency.setValueAtTime(700 + 600 * vel, t0); lp.frequency.exponentialRampToValueAtTime(240, t0 + 0.2);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(peak, t0 + 0.014);
  g.gain.setTargetAtTime(peak * 0.5, t0 + 0.016, 0.08);
  g.gain.setTargetAtTime(0.0001, t0 + 0.12, 0.5);
  g.gain.setTargetAtTime(0.0001, t0 + dur, 0.045);
  const o1 = a.createOscillator(); o1.type = "triangle";
  o1.frequency.setValueAtTime(f * 1.012, t0); o1.frequency.exponentialRampToValueAtTime(f, t0 + 0.05);
  const o2 = a.createOscillator(); o2.type = "sine"; o2.frequency.value = f;
  const body = a.createGain(); body.gain.value = 0.9;
  o1.connect(lp); o2.connect(body).connect(lp); lp.connect(g); g.connect(musicBus);
  const v = a.createGain(); v.gain.value = 0.25; g.connect(v).connect(verbIn);
  o1.start(t0); o2.start(t0); o1.stop(t0 + dur + 0.3); o2.stop(t0 + dur + 0.3);
  noiseBurst(t0, 0.025, 0.02 * vel, "bandpass", f * 5, 1.2, musicBus);    // finger pluck
}
const RIDE_HZ = [3120, 4680, 5235, 6370, 7840, 9210];
function ride(t0, vel = 0.5) {
  const a = actx; if (!a) return;
  const hp = a.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 5200;
  const g = a.createGain(), peak = 0.0025 + 0.005 * vel;
  g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(peak, t0 + 0.002);
  g.gain.setTargetAtTime(0.0001, t0 + 0.003, 0.22);
  RIDE_HZ.forEach(fq => { const o = a.createOscillator(); o.type = "square"; o.frequency.value = fq * (0.995 + Math.random() * 0.01); o.connect(hp); o.start(t0); o.stop(t0 + 1.0); });
  hp.connect(g); g.connect(musicBus); const v = a.createGain(); v.gain.value = 0.4; g.connect(v).connect(verbIn);
  noiseBurst(t0, 0.03, 0.006 * vel, "bandpass", 8500, 1.5, musicBus);      // stick ping
}
function hatFoot(t0, vel = 0.5) { noiseBurst(t0, 0.045, 0.03 * vel, "bandpass", 3600, 1.4, musicBus); }
function feather(t0) { osc("sine", 58, t0, 0.12, 0.022, { slide: 45, dest: musicBus }); }

// ---- harmony helpers
const pcOf = (m) => ((m % 12) + 12) % 12;
function rng(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function poolNotes(pcs, lo, hi) { const out = []; for (let m = lo; m <= hi; m++) if (pcs.includes(pcOf(m))) out.push(m); return out; }
// So What voicing (three 4ths with a 3rd on top), built down diatonically from `top`
function soWhat(top, scale) {
  const deg = poolNotes(scale, 24, 108), i = deg.indexOf(top);
  if (i < 0) return [top];
  return [i, i - 2, i - 5, i - 8, i - 11].map(k => deg[Math.max(0, k)]);
}
const BASS_LO = 31, BASS_HI = 50;       // G1 .. D3
function placePc(pc, near) { let best = null; for (let m = BASS_LO; m <= BASS_HI; m++) if (pcOf(m) === pc && (best === null || Math.abs(m - near) < Math.abs(best - near))) best = m; return best; }
function scaleStep(m, scale, dir) { for (let k = 1; k <= 3; k++) { const c = m + dir * k; if (scale.includes(pcOf(c))) return c; } return m + dir * 2; }
// walking bass: roots on chord changes, scale steps between, chromatic / dominant approach into the next root
function buildWalk(tr) {
  const r = rng(tr.seed), tl = tr.timeline, out = [];
  let prev = placePc(tl[0].root, 40), dir = 1;
  for (let i = 0; i < tl.length; i++) {
    const ch = tl[i], nx = tl[(i + 1) % tl.length];
    const starts = i === 0 || tl[i - 1] !== ch, ends = nx !== ch || (i + 1) % 16 === 0;
    let m;
    if (starts) m = placePc(ch.root, prev);
    else if (ends) {
      const target = placePc(nx.root, prev), x = r();

// chord = rootless left-hand voicing (Jazzology type A/B), right-hand note pool (chord tones + tensions,
// avoid-notes left out), and the scale the bass walks in
const ch_ = (name, root, lh, pcs, scale) => ({ name, root, lh, pcs, scale });
const IONIAN = [0, 2, 4, 5, 7, 9, 11];
const mode = (root, steps) => steps.map(s => pcOf(root + s));
const DORIAN = [0, 2, 3, 5, 7, 9, 10], MIXO = [0, 2, 4, 5, 7, 9, 10], PHRYG = [0, 1, 3, 5, 7, 8, 10], ALT = [0, 1, 3, 4, 6, 8, 10];
// SWING: I-VI-ii-V twice in C (iii for I second time). Type A/B alternate on 4th/5th root motion.
const SW = {
  C:  ch_("Cmaj9", 0, [52, 55, 59, 62], [0, 2, 4, 7, 9, 11], mode(0, IONIAN)),
  A:  ch_("A7alt", 9, [55, 60, 61, 65], [9, 1, 7, 10, 0, 5], mode(9, ALT)),
  Dm: ch_("Dm9", 2, [53, 57, 60, 64], [2, 5, 9, 0, 4], mode(2, DORIAN)),
  G:  ch_("G13", 7, [53, 57, 59, 64], [7, 11, 2, 5, 9, 4], mode(7, MIXO)),
  Em: ch_("Em7", 4, [55, 57, 59, 62], [4, 7, 11, 2, 9], mode(4, PHRYG)),
};
// BLUES in F, as voiced in Jazzology ch.6 (ii-Vs in bars 4 & 9, B dim passing chord, turnaround)
const BL = {
  F:   ch_("F13", 5, [51, 55, 57, 62], [5, 9, 0, 3, 7, 2], mode(5, MIXO)),
  Bb:  ch_("Bb13", 10, [50, 55, 56, 60], [10, 2, 5, 8, 0, 7], mode(10, MIXO)),
  Cm:  ch_("Cm9", 0, [51, 55, 58, 62], [0, 3, 7, 10, 2], mode(0, DORIAN)),
  Bo:  ch_("B°7", 11, [50, 53, 56, 59], [11, 2, 5, 8], [11, 1, 2, 4, 5, 7, 8, 10]),

function drawFx(dt, now) {

    const x = f.x0 + (s.x - f.x0) * e, y = f.y0 + (s.y - f.y0) * e - Math.sin(Math.PI * p) * (f.arc || 120);

    if (Math.random() < 0.7) particles.push({ x, y, vx: 0, vy: 20, life: 0, max: 0.3, c: BAUBLE_COLS[f.z.slot % 4][0], s: 3 });
    if (p >= 1) { burst(s.x, s.y, [BAUBLE_COLS[f.z.slot % 4][0], COL.white], 10, 90); return false; } return true; });

    ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x / 3) * 3, Math.round(p.y / 3) * 3, p.s, p.s); return true; });

    if (Math.floor(p.life * 12) % 2 === 0 || p.life > 0.4) { txt(p.text, p.x, yy, 14, p.c, "center", COL.void); if (p.sub) txt(p.sub, p.x, yy + 20, 10, COL.white, "center", COL.void); }

}

// =================================================================== loop
let last = performance.now();
